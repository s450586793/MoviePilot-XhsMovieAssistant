[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xhs-mp-bridge"
version = "0.2.0"
description = "Xiaohongshu mention capture and idempotent request storage"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.55,<2",
]

[project.optional-dependencies]
test = [
  "fastapi~=0.136.3",
  "httpx~=0.28.1",
  "pytest==8.4.1",
  "pydantic>=2.10,<3",
  "pytest-cov>=6,<8",
]

[project.scripts]
xhs-phase3-import = "xhs_probe.phase3_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
filterwarnings = [
  'ignore:Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.:starlette.exceptions.StarletteDeprecationWarning',
  'ignore:The anyio\.abc\.BlockingPortal alias is deprecated, use anyio\.from_thread\.BlockingPortal instead\.:DeprecationWarning:starlette\.testclient',
]
pythonpath = ["src", "plugins.v2"]
testpaths = ["tests"]
