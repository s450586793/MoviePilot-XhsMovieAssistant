services:
  xhs-mp-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: xhs-mp-bridge:phase1
    container_name: xhs-mp-bridge
    restart: unless-stopped
    init: true
    user: "${PUID:-1026}:${PGID:-100}"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      XHS_CDP_URL: "${XHS_CDP_URL:?Set the CloakBrowser profile CDP URL}"
      XHS_CDP_TOKEN: "${XHS_CDP_TOKEN:-}"
      XHS_NOTIFICATION_URL: "${XHS_NOTIFICATION_URL:-https://www.xiaohongshu.com/notification}"
      XHS_PROBE_OUTPUT_DIR: "/data/probe"
      XHS_PROBE_TIMEOUT_SECONDS: "${XHS_PROBE_TIMEOUT_SECONDS:-30}"
    volumes:
      - ./data/app:/data
      - ./logs:/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, os, urllib.request;
          token = os.getenv('XHS_CDP_TOKEN', '');
          headers = {'Authorization': 'Bearer ' + token} if token else {};
          status_url = os.environ['XHS_CDP_URL'].removesuffix('/cdp') + '/status';
          request = urllib.request.Request(status_url, headers=headers);
          payload = json.load(urllib.request.urlopen(request, timeout=15));
          assert payload.get('status') == 'running', payload
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
