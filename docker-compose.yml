services:
  xhs-mp-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: xhs-mp-bridge:phase1
    container_name: xhs-mp-bridge
    restart: unless-stopped
    init: true
    user: "${PUID:-1026}:${PGID:-100}"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      XHS_CDP_URL: "${XHS_CDP_URL:?Set the CloakBrowser profile CDP URL}"
      XHS_CDP_TOKEN: "${XHS_CDP_TOKEN:-}"
      XHS_PROBE_OUTPUT_DIR: "/data/probe"
      XHS_PROBE_TIMEOUT_SECONDS: "${XHS_PROBE_TIMEOUT_SECONDS:-30}"
    volumes:
      - ./data/app:/data
      - ./logs:/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          token = os.getenv('XHS_CDP_TOKEN', '');
          headers = {'Authorization': 'Bearer ' + token} if token else {};
          request = urllib.request.Request(os.environ['XHS_CDP_URL'], headers=headers);
          urllib.request.urlopen(request, timeout=5).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
